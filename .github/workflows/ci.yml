
name: CI

on: [push, pull_request]

jobs:
  syntax-check:
    name: Zsh syntax check
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Check out source code
        uses: actions/checkout@v4

      - &install-zsh
        name: Install Zsh (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Check syntax of Zsh scripts and theme files
        run: |
          shopt -s globstar failglob
          for file in **/*.zsh **/*.zsh-theme; do
            echo "Checking syntax: $file"
            zsh -n "$file"
          done

  prompt-smoke-test:
    name: Prompt smoke test (${{ matrix.os }})
    needs: syntax-check
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - *checkout
      - *install-zsh

      - name: Install Expect (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y expect

      - name: Verify interactive prompt
        run: |
          mkdir -p "$RUNNER_TEMP/zsh-config"
          printf 'source "%s/cobalt-spark.plugin.zsh"\n' "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/zsh-config/.zshrc"
          ZDOTDIR="$RUNNER_TEMP/zsh-config" expect tests/smoke.exp zsh -di
