name: Try it [smoke test]

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  try-it:
    name: Run 'Try it' demo
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Install Zsh and Expect
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh expect

      - name: Extract 'Try it' command from README
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/azhuchkov/cobalt-spark/main/README.md \
            -o "$RUNNER_TEMP/README.md"

          command=$(awk '
            /^## Try it$/ { section=1; next }
            section && /^```zsh$/ { getline; print; exit }
          ' "$RUNNER_TEMP/README.md")

          [[ -n $command ]] || {
            echo "::error::Try it command not found in README"
            exit 1
          }

          echo "TRY_IT_COMMAND=$command" >> "$GITHUB_ENV"

      - name: Run 'Try it' command
        run: |
          expect <<'EXPECT'
          set timeout 90
          log_file -noappend "$env(RUNNER_TEMP)/try-it.log"

          spawn zsh -fic $env(TRY_IT_COMMAND)

          expect {
            -re {compinit: insecure directories} {
              puts stderr "Completion initialization requires confirmation"
              exit 1
            }
            -exact "⚡" {}
            timeout {
              puts stderr "Timed out waiting for Cobalt Spark prompt"
              exit 1
            }
            eof {
              puts stderr "Demo exited before displaying the prompt"
              exit 1
            }
          }

          send -- "exit\r"

          expect {
            eof {}
            timeout {
              puts stderr "Timed out waiting for demo to exit"
              exit 1
            }
          }

          set result [wait]
          exit [lindex $result 3]
          EXPECT

      - name: Upload 'Try it' log as a job artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: try-it-log
          path: ${{ runner.temp }}/try-it.log
          retention-days: 7
          if-no-files-found: warn
